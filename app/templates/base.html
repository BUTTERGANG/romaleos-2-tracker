<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMALEOS 2 Tracker {% block title %}{% endblock %}</title>
    <meta name="description" content="Live Nike Romaleos 2 eBay price tracker — filter by size, price and condition, and get Discord alerts when a matching pair is listed.">
    <meta property="og:title" content="ROMALEOS 2 Tracker">
    <meta property="og:description" content="Live Nike Romaleos 2 eBay listings with size/price filters and Discord alerts.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#0f1117">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>👟</text></svg>">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="logo">👟 ROMALEOS 2 Tracker</a>
            <div class="nav-links">
                <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Listings</a>
                <a href="/watches" {% if request.url.path == '/watches' %}class="active"{% endif %}>Watches</a>
                <a href="https://github.com/BUTTERGANG/romaleos-2-tracker" target="_blank" rel="noopener" class="ext">GitHub</a>
            </div>
            <div class="nav-status">
                {% if ebay_configured %}
                <span class="badge green" title="eBay API connected">eBay ✓</span>
                {% elif has_credentials %}
                <span class="badge yellow" title="Partial eBay credentials">eBay ⚡</span>
                {% else %}
                <span class="badge red" title="eBay API not configured">eBay ✗</span>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>ROMALEOS 2 Tracker &middot; eBay Browse API &middot; BUTTERGANG</p>
    </footer>
    <div id="toast-container"></div>
    <script>
        function showToast(html) {
            const el = document.getElementById('toast-container');
            el.innerHTML = html;
            setTimeout(() => { el.innerHTML = ''; }, 4000);
        }

        // Manual "Refresh from eBay": poll, then swap in the new listing grid
        // (and stats) without a jarring full-page reload.
        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('[data-refresh]');
            if (!btn) return;
            e.preventDefault();
            const label = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Refreshing…';
            document.querySelector('.listings-grid')?.classList.add('is-loading');
            try {
                const resp = await fetch('/api/refresh', { method: 'POST' });
                showToast(await resp.text());
                if (resp.ok) {
                    const page = await (await fetch(window.location.href)).text();
                    const doc = new DOMParser().parseFromString(page, 'text/html');
                    for (const sel of ['.listings-grid', '.stats-row', '.freshness']) {
                        const fresh = doc.querySelector(sel);
                        const cur = document.querySelector(sel);
                        if (fresh && cur) cur.replaceWith(fresh);
                    }
                }
            } catch (err) {
                showToast(`<div class="toast error">❌ Network error: ${err.message}</div>`);
            } finally {
                document.querySelector('.listings-grid')?.classList.remove('is-loading');
                btn.disabled = false;
                btn.textContent = label;
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
